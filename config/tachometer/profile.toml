[repo]
name = "tachometer"
category = "util-repos"
kind = "python"

[paths]
disk_path = "."
profile_path = ".tachometer/profile.json"
summary_path = ".tachometer/summary.json"
host_profile_path = ".tachometer/host-profile.json"
host_summary_path = ".tachometer/host-summary.json"

[defaults]
label = "repo-snapshot"
# [notify] values are machine-local — do not commit real paths or contact identifiers here.
[notify]
shock_relay_root = ""
service = "signal"
target = ""
