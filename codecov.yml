# Start informational: report coverage on pull requests without blocking them.
# Add a target here once the baseline number is known.
# The portfolio seam is a hash-pinned copy of traction-control/themes/portfolio_site.py and is
# tested at its source, so it does not count against this repository.
ignore:
  - "src/tachometer/portfolio/**"

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "condensed_header, diff, files"
