[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tachometer"
version = "0.1.0"
description = "Shared repo and resource profiling helpers for portfolio repos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Cason Konzer", email = "casonk@umich.edu" },
]
keywords = ["profiling", "benchmarking", "repo", "resources", "devops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/casonk/tachometer"
Repository = "https://github.com/casonk/tachometer"
Changelog = "https://github.com/casonk/tachometer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "dyno-lab"]

[project.scripts]
tachometer = "tachometer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: pure unit tests — no I/O, network, or subprocesses",
  "integration: multi-component or filesystem tests",
  "smoke: end-to-end health checks",
  "slow: tests that take several seconds",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
  "B008",
  "SIM108",
]
